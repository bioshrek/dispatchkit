# Scheduler settings for `dispatch resolve` (and, from D5, `dispatch tick`).
#
# These are the two dials that decide how much work runs at once and when a
# failing task becomes a human's problem. Both are starting guesses; tune them
# against observed review load rather than raising them because the board
# looks idle.

[caps]
# Concurrent cloud agent tasks. Bounded by review capacity, not by API limits:
# more open PRs than a person can read is a queue, not throughput.
cloud = 3
# Concurrent local tasks. One, because the local daemon shares a working tree.
local = 1

[retry]
# Attempts before a task is labelled `dispatch:stuck` and left alone.
budget = 3
