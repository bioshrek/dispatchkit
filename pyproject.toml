[project]
name = "dispatchkit"
version = "0.2.0"
description = "Dispatch a dependency-ordered task graph to GitHub coding agents, idempotently"
requires-python = ">=3.12"
readme = "README.md"
# Deliberately empty, and enforced by a test. The scheduler runs in a job that
# holds a token which can assign work; there is no third-party code in it.
dependencies = []

[project.scripts]
dispatchkit = "dispatchkit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatchkit"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure functions, no I/O (tier 1, always runs)",
    "replay: full pass against recorded API payloads, no live network (tier 2, runs in CI)",
    "live: hits a real repository and Project board; deselected by default",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dispatchkit", "tests"]
mypy_path = "src:."

[tool.importlinter]
root_package = "dispatchkit"

# One direction only. `gh_cli` is the sole module allowed to shell out, and it
# sits above everything it adapts; the pure planners below it cannot reach back
# up into the process boundary.
[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "dispatchkit.cli",
    "dispatchkit.gh_cli",
    "dispatchkit.workstation_cli",
    "dispatchkit.init",
    "dispatchkit.watcher",
    "dispatchkit.doctor",
    "dispatchkit.dispatcher",
    "dispatchkit.tick",
    "dispatchkit.local",
    "dispatchkit.recover",
    "dispatchkit.apply",
    "dispatchkit.retro",
    "dispatchkit.resolve",
    "dispatchkit.lints",
    "dispatchkit.metrics",
    "dispatchkit.github",
    "dispatchkit.workstation",
    "dispatchkit.block",
    "dispatchkit.validate",
    "dispatchkit.parse",
    "dispatchkit.config",
    "dispatchkit.model",
    "dispatchkit.errors",
]
